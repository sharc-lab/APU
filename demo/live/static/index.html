<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Run</title>
<style>
:root { --bg: #fafaf8; --card: #ffffff; --ink: #1d1d1f; --ink2: #5a5a60; --line: #e2e2dc; --ok: #1a7f37;
  --bad: #c62828; --warn: #b26a00; --blue: #1f5fbf; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 20px/1.35 system-ui, "Segoe UI", sans-serif; }
main { max-width: 1560px; margin: 0 auto; padding: 16px; min-height: 100vh; display: flex; flex-direction: column; gap: 14px; }
header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
h1 { font-size: 30px; margin: 0; flex: 1; white-space: nowrap; }
select, button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); }
button { background: var(--blue); color: #fff; border-color: var(--blue); cursor: pointer; }
button:disabled { opacity: .5; cursor: default; }
.tag { display: inline-block; font-size: 13px; font-weight: 700; letter-spacing: .04em; padding: 1px 7px; border-radius: 5px;
  border: 1px solid currentColor; vertical-align: middle; margin-left: 4px; }
.LIVE { color: var(--ok); } .REPLAYED { color: var(--warn); } .MEASURED { color: var(--blue); }
.mode { font-size: 22px; font-weight: 800; padding: 4px 12px; border-radius: 8px; border: 2px solid currentColor; }
.sub { color: var(--ink2); font-size: 18px; }
.tally { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.tcard, .lane { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.tcard h3, .lane h2 { margin: 0 0 6px; font-size: 24px; }
.big { font-size: 44px; font-weight: 800; line-height: 1.05; }
.row { display: flex; justify-content: space-between; gap: 8px; }
.lanes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; flex: 1; }
.lane .now { min-height: 150px; border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 8px; }
.meter { height: 22px; background: #eee; border-radius: 6px; position: relative; overflow: hidden; margin: 6px 0; }
.meter > div { position: absolute; left: 0; top: 0; bottom: 0; background: #7aa7e8; }
.meter.cut > div { background: var(--bad); }
.cutflag { color: var(--bad); font-weight: 800; }
.okflag { color: var(--ok); font-weight: 700; }
.res { font-size: 18px; display: flex; justify-content: space-between; border-bottom: 1px dashed var(--line); padding: 3px 0; }
.res .w { color: var(--bad); font-weight: 700; } .res .c { color: var(--ok); font-weight: 700; }
.head { font-size: 17px; color: var(--ink2); }
footer { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.cmp td, .cmp th { padding: 3px 10px; text-align: right; font-size: 18px; } .cmp th:first-child, .cmp td:first-child { text-align: left; }
@media (max-width: 900px) { .tally, .lanes, footer { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Same task, three ways to run it</h1>
    <select id="scenario"></select>
    <button id="go">Run 5 tasks</button>
    <span id="mode" class="mode"></span>
    <span id="speed" class="mode REPLAYED" style="display:none">2x speed</span>
  </header>
  <div class="sub" id="what"></div>
  <section class="tally" id="tally"></section>
  <section class="lanes">
    <div class="lane" id="lane-default"></div>
    <div class="lane" id="lane-ours"></div>
    <div class="lane" id="lane-cloud"></div>
  </section>
  <div class="sub" id="hl-sub"></div>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const LANE_NAME = {default: "Default local", ours: "Ours", cloud: "All cloud"};
let meta = null, since = 0, label = "LIVE", state = null, timer = null;
const tag = t => `<span class="tag ${t}">${t}</span>`;
const money = v => v == null ? "n/a" : "$" + Number(v).toFixed(v < 0.01 ? 5 : 4);

function laneHelp(sc, lane) {
  const s = meta.scenarios[sc];
  if (lane === "default") return s.default_label + ": every task runs here; a real run on the AMD workstation.";
  if (lane === "ours") return "Decides at the start of each task: run here if the conversation fits in memory, else the cloud from the first step; if the conversation gets cut off anyway, the task goes to the cloud.";
  return "Every task on " + s.cloud_model + ".";
}
function fresh(sc) {
  state = {sc, lanes: {}, tasks: [], cur: null, t0: Date.now()};
  for (const l of ["default", "ours", "cloud"]) state.lanes[l] = {now: null, results: []};
  render();
}
function render() {
  if (!state) return;
  $("#hl-sub").style.display = state.sc === "amd8192" ? "" : "none";
  const sc = state.sc;
  $("#what").innerHTML = state.cur ? `Task ${state.tasks.length} of ${state.n || 5} (${esc(state.cur.task_type || "")}): step ${state.cur.turn_idx} of a conversation. The ${state.cur.history_turns} earlier steps are ${tag("REPLAYED")} from a recorded session; this step runs ${tag(label === "REPLAYED" ? "REPLAYED" : "LIVE")}.` : "";
  for (const l of ["default", "ours", "cloud"]) {
    const L = state.lanes[l], n = L.now;
    let now = "";
    if (n) {
      const used = n.used, own = n.own, win = n.win;
      const pct = win ? Math.min(100, 100 * (used || own || 0) / win) : 0;
      now += n.route === "cloud" ? `<div class="row"><span></span><span>${(n.secs || 0).toFixed(1)} s</span></div>` : `<div class="row"><span>steps done: <b>${n.steps}</b></span><span>${(n.secs || 0).toFixed(1)} s</span></div>`;
      if (n.route === "cloud") now += `<div>On the cloud${n.model ? " (" + esc(n.model) + ")" : ""}${n.reason ? ": " + esc(n.reason) : ""}</div>`;
      if (win || own) now += `<div class="head">memory for the conversation: ${used != null ? used.toLocaleString() : "?"} of ${own ? own.toLocaleString() : "?"} tokens seen${win ? ", room for " + win.toLocaleString() : ""}</div><div class="meter ${n.cut ? "cut" : ""}"><div style="width:${pct}%"></div></div>`;
      if (n.cut) now += `<div class="cutflag">Cut off: the model did not see the whole conversation</div>`;
      else if (n.countOnly) now += `<div class="head" style="color:var(--warn)">Token-count flag only; the server showed no cut (a known false alarm of this check)</div>`;
      else if (n.steps && n.route !== "cloud") now += `<div class="okflag">Whole conversation seen</div>`;
      if (n.tools && n.tools.length) now += `<div class="head">tools used: ${esc(n.tools.join(", "))}</div>`;
      if (n.decision) now += `<div class="head">${esc(n.decision)}</div>`;
      if (n.escalated) now += n.cut ? `<div class="cutflag">Cut off, so this task went to the cloud</div>`
        : `<div class="head" style="color:var(--warn)">Sent to the cloud on that flag, as the protocol says</div>`;
    }
    const res = L.results.map(r => `<div class="res"><span>${esc(r.task)}</span><span>${r.ok === true ? '<span class="c">correct</span>' : r.ok == null ? "n/a" : '<span class="w">WRONG' + (r.flagged ? ", flagged" : ", silent") + "</span>"} ${r.usd ? money(r.usd) : ""} ${tag(r.label)}</span></div>`).join("");
    $("#lane-" + l).innerHTML = `<h2>${LANE_NAME[l]}</h2><div class="head">${esc(laneHelp(sc, l))}</div><div class="now">${now}</div>${res}`;
  }
}
function laneTag(x) {
  if (label === "REPLAYED") return tag("REPLAYED");
  const ls = (x.labels || []).map(v => v === "NOT AVAILABLE" ? "REPLAYED" : v);
  const u = [...new Set(ls.length ? ls : [label])];
  return u.map(tag).join("");
}
function hlLine(l) {
  const h = meta && meta.headline;
  if (!h || h.status !== "VERIFIED" || state.sc !== "amd8192") return "";
  const x = h[l], kept = l === "default" ? x.n : (l === "ours" ? x.kept_local : 0);
  return `<div class="row head"><span>recorded headline ${tag("MEASURED")}</span><span>${x.correct}/${x.n} correct, kept local ${kept}/${x.n}, ${money(x.usd_task)}/task</span></div>`;
}
function tallyHTML(t) {
  if (!t) return "";
  return ["default", "ours", "cloud"].map(l => {
    const x = t[l];
    return `<div class="tcard"><h3>${LANE_NAME[l]}</h3><div class="big">${x.correct}/${x.graded} correct ${laneTag(x)}</div>
      <div class="row"><span>wrong answers</span><b>${x.wrong} (${x.wrong_silent} silent, ${x.wrong_flagged} flagged)</b></div>
      <div class="row"><span>kept local</span><b>${x.kept_local}/${x.graded}</b></div>
      <div class="row"><span>cloud cost per task</span><b>${money(x.usd_ledger_per_task)} ledger, ${money(x.usd_cache_priced_per_task)} cache-priced</b></div>
      <div class="row"><span>time</span><b>${x.seconds} s</b></div>${hlLine(l)}</div>`;
  }).join("");
}
function onEvent(e) {
  const L = e.lane ? state.lanes[e.lane] : null;
  if (e.event === "run_start") { label = e.label.startsWith("REPLAYED") ? "REPLAYED" : "LIVE"; $("#mode").textContent = e.label; $("#mode").className = "mode " + label; state.n = e.n_tasks; }
  if (e.event === "task_start") { state.cur = e; state.tasks.push(e); for (const l in state.lanes) state.lanes[l].now = null; }
  if (e.event === "lane_start") L.now = {steps: 0, secs: 0, tools: [], route: e.lane === "cloud" ? "cloud" : "local",
                                         model: e.lane === "cloud" ? meta.scenarios[state.sc].cloud_model : null};
  if (e.event === "call") { const n = L.now || (L.now = {steps: 0, secs: 0, tools: []}); n.steps = e.n; n.secs += e.seconds || 0; n.used = e.used_tokens; n.own = e.own_tokens; n.win = e.loaded_window || e.num_ctx; const direct = (e.evidence || []).some(x => !String(x).startsWith("model saw")); n.cut = n.cut || (e.cut && direct); n.countOnly = n.countOnly || (e.cut && !direct); n.tools = n.tools.concat(e.tool_calls || []); }
  if (e.event === "decision") { L.now.decision = e.decision.reason; if (e.decision.route === "cloud") { L.now.route = "cloud"; L.now.model = e.decision.model; } }
  if (e.event === "escalate") { L.now.escalated = true; }
  if (e.event === "lane_end") {
    const r = e.result, c = r.cloud || r;
    const lab = label === "REPLAYED" ? "REPLAYED" : (r.route === "cloud" || r.escalated ? (c.label || "LIVE") : label);
    if (r.route === "cloud") { L.now.route = "cloud"; L.now.model = r.model; L.now.secs = r.seconds || L.now.secs; }
    L.results.push({task: state.cur ? state.cur.task_id : "", ok: r.end_state_ok, flagged: !!r.flagged && !r.escalated && (r.calls || []).some(c => (c.evidence || []).some(x => !String(x).startsWith("model saw"))),
                    usd: r.route === "cloud" ? r.usd_ledger : (r.escalated ? c.usd_ledger : 0), label: lab === "NOT AVAILABLE" ? "REPLAYED" : lab});
  }
  if (e.event === "tally") { $("#tally").innerHTML = tallyHTML(e.tally); }
  if (e.event === "speed") { $("#speed").textContent = e.x + "x speed"; $("#speed").style.display = e.x > 1 ? "" : "none"; }
  if (e.event === "error") { $("#what").textContent = "Stopped: " + e.error; }
  if (e.event === "run_end") { $("#go").disabled = false; }
}
async function poll() {
  const r = await (await fetch("/api/events?since=" + since)).json();
  for (const e of r.events) { since = e.i + 1; onEvent(e); }
  render();
  if (!r.done) timer = setTimeout(poll, 400); else $("#go").disabled = false;
}
async function init() {
  meta = await (await fetch("/api/meta")).json();
  $("#scenario").innerHTML = Object.entries(meta.scenarios).map(([k, s]) => `<option value="${k}">${esc(s.label)}</option>`).join("");
  const h = meta.headline;
  $("#hl-sub").textContent = h && h.status === "VERIFIED" ? `Recorded headline (MEASURED, replay of recorded runs): AMD workstation at memory 8,192, ${h.ours.n} tasks, cloud ${h.cloud_model}; register row ${h.row}. Cloud cost: ledger = every input token at the full rate; cache-priced = with prompt caching, the headline's basis.` : "";
  $("#mode").textContent = meta.mode === "replay" ? "REPLAYED" : meta.mode === "laptop" ? "LIVE (development)" : "LIVE";
  $("#mode").className = "mode " + (meta.mode === "replay" ? "REPLAYED" : "LIVE");
  const auto = new URLSearchParams(location.search);
  if (auto.get("scenario")) $("#scenario").value = auto.get("scenario");
  $("#go").onclick = start;
  fresh($("#scenario").value);
  if (auto.get("autorun") === "1") start();
}
async function start() {
  $("#go").disabled = true; since = 0; fresh($("#scenario").value);
  await fetch("/api/run?scenario=" + $("#scenario").value, {method: "POST"});
  clearTimeout(timer); poll();
}
init();
</script>
</body>
</html>
