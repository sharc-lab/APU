[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apu-research"
version = "0.1.0"
description = "Reproducible benchmark and routing study for hybrid cloud/local agent execution"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.30.0",
    "httpx>=0.24.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "PyYAML>=6.0.0",
    "scikit-learn>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
