# Measurement host — NOT a BOM candidate.
# Razer Blade 15, RTX 4070 Laptop GPU, 8188 MiB GDDR6 VRAM.
#
# memory_architecture: discrete
#   Weights and KV live in dedicated VRAM. System RAM is a separate pool
#   and irrelevant to the inference budget. reserved_gb here is VRAM
#   driver/framework overhead, not system RAM — this field means something
#   different from unified configs where reserved_gb covers the OS.
#
# bom_cost_usd: 0 — excluded from BOM analysis and Pareto frontiers.
# Quality-vs-depth results collected on this host transfer to unified targets;
# TTFT, throughput, and BOM feasibility numbers do not.
name: blade_rtx4070
memory_architecture: discrete
memory_gb: 8
has_npu: false
npu_tops: 0
quant: q4_k_m
bom_cost_usd: 0
reserved_gb: 0.8
notes: >
  Razer Blade 15, RTX 4070 Laptop GPU, 8188 MiB GDDR6 VRAM.
  Measurement host for Paper 1 context-depth sweep.
  NOT a BOM candidate: discrete GDDR6 bandwidth and pressure dynamics
  differ from unified LPDDR5x targets (AMD Strix Halo, Apple Silicon).
  reserved_gb = 0.8 is VRAM overhead estimate; verify with nvidia-smi
  after model load.
