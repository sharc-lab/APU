# Maps sdk_direct.py task IDs to all probes in the matched probe category.
#
# probe_ids: list of probe IDs from evaluation/probes/prompts.jsonl whose
#   category is closest to the task's workload.  QualityEvaluator scores all
#   span_match probes in the list and reports the mean; other scorer types
#   (exact, schema, unit_test) currently return null from _score_with_probe
#   because their expected values are prompt-specific and cannot evaluate
#   arbitrary task outputs.  The list is still valuable: it makes every
#   non-judge probe reachable for category coverage analysis, and adding a
#   task-specific span_match probe to prompts.jsonl and this list instantly
#   hooks it into deterministic scoring.
#
# category: matches the "category" key in harness/adapters/sdk_direct.py TASKS.
#
# Judge probes (scorer_type=judge) are deliberately excluded; they are the
# LLM-judge fallback and not part of deterministic scoring.

CH-01:
  probe_ids:
    - cod_01
    - cod_02
    - cod_03
    - cod_04
    - cod_05
    - cod_06
    - cod_07
    - cod_08
    - cha_02
    - cha_03
    - cha_04
    - cha_05
    - cha_06
  category: code_hybrid

