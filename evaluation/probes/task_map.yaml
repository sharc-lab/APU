# Maps sdk_direct.py task IDs to the nearest probe in evaluation/probes/prompts.jsonl.
#
# probe_id is used by QualityEvaluator._score_with_probe; deterministic scoring
# fires only for span_match probes (rea_07 here).  All other probe types fall
# through to the LLM judge — the mapping still documents the category alignment
# and provides the hook for future span_match probes.
#
# category matches the "category" key in sdk_direct.py TASKS.

